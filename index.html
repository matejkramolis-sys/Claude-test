  <!-- ============ EDITING ============ -->
  <section id="editing" class="section">
    <h2 class="section-title">Editing</h2>

    <!--
      TO ADD/CHANGE A VIDEO:
      - data-src  -> path to your video file in the /videos folder
      - <img src>  -> optional thumbnail (delete the line for a plain placeholder)
      - the <p>    -> the short caption shown under the video
    -->
    <div class="video-grid">

      <figure class="video-card" data-src="videos/edit-1.mp4">
        <div class="thumb">
          <img src="videos/edit-1.jpg" alt="" onerror="this.style.display='none'" />
          <span class="play-badge" aria-hidden="true">▶</span>
        </div>
        <figcaption>Edited by me.</figcaption>
